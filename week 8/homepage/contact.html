<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bright Studio | Contact</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <!-- Navigation -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                Bright Studio

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="mainNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="services.html">
                            Services
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="contact.html">
                            Contact
                        </a>
                    </li>

                </ul>


                <button
                    id="darkModeBtn"
                    class="btn btn-outline-light ms-lg-3 mt-3 mt-lg-0">

                    Dark Mode

                </button>

            </div>

        </div>

    </nav>


    <!-- Contact -->

    <main>

        <section class="container section-padding">

            <div class="row justify-content-center">

                <div class="col-12 col-lg-8">

                    <div class="page-heading text-center">

                        <span class="small-title">
                            CONTACT
                        </span>

                        <h1>
                            Let's talk about your project.
                        </h1>

                        <p>
                            Fill in the form and
                            we will get back to you.
                        </p>

                    </div>


                    <form id="contactForm"
                          class="contact-form">


                        <div class="mb-3">

                            <label for="name"
                                   class="form-label">

                                Name

                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Your name"
                                required>

                        </div>


                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="your@email.com"
                                required>

                        </div>


                        <div class="mb-3">

                            <label for="message"
                                   class="form-label">

                                Message

                            </label>

                            <textarea
                                id="message"
                                class="form-control"
                                rows="6"
                                placeholder="Tell us about your project..."
                                required>
                            </textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            Send Message

                        </button>


                        <div id="formMessage"
                             class="mt-3">
                        </div>


                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer class="footer">

        <div class="container text-center">

            <p class="mb-0">
                © 2026 Bright Studio
            </p>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/script.js"></script>

</body>

</html>
