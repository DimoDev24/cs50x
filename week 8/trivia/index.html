<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>

            document.addEventListener("DOMContentLoaded", function() {

                let correct = document.querySelector("#correct");
                correct.addEventListener("click", function() {
                    correct.style.backgroundColor = "green";
                    document.querySelector("#calification1").innerHTML = "Correct!";
                });

                let incorrects = document.querySelectorAll("#incorrect");
                for (let i = 0; i < incorrects.length; i++) {
                    incorrects[i].addEventListener("click", function() {
                        incorrects[i].style.backgroundColor = "red";
                        document.querySelector("#calification1").innerHTML = "Incorrect...";
                    }
                )};

                document.querySelector("#check").addEventListener("click", function() {
                    let input = document.querySelector("input");
                    if (input.value === "Miguel" || input.value === "miguel") {
                        input.style.backgroundColor = "green";
                        document.querySelector("#calification2").innerHTML = "Correct!";
                    }
                    else {
                        input.style.backgroundColor = "red";
                        document.querySelector("#calification2").innerHTML = "Incorrect...";
                    }
                });
            });

        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What's the capital of Spain?</h3>
                <button id="incorrect">Barcelona</button>
                <button id="correct">Madrid</button>
                <button id="incorrect">Seville</button>
                <button id="incorrect">Benidorm</button>
                <p id="calification1"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>What's the first name of the author of Don Quixote?</h3>
                <input type="text">
                <button id=check>Check answer</button>
                <p id="calification2"></p>
            </div>
        </div>
    </body>
</html>
